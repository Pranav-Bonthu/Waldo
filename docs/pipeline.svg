<svg xmlns="http://www.w3.org/2000/svg" width="760" height="856" viewBox="0 0 760 856">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="760" height="856" fill="#FFFFFF"/>
<text x="30" y="28" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#444441">How the finder works</text>
<text x="320" y="28" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="12" fill="#5F5E5A">what happens at each step</text>
<rect x="18" y="342" width="274" height="298" rx="12" fill="none" stroke="#888780" stroke-width="0.8" stroke-dasharray="4 4"/>
<rect x="47.0" y="345" width="216" height="16" fill="#FFFFFF"/>
<text x="155.0" y="354" text-anchor="middle" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="11" fill="#5F5E5A">repeated for each size and each cut-out</text>
<rect x="30" y="71" width="250" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="155.0" y="89" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#444441">1. What we start with</text>
<text x="155.0" y="109" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="12" fill="#5F5E5A">a Waldo cut-out and a page</text>
<rect x="320" y="56" width="410" height="86" rx="10" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="1"/>
<path d="M321 92.0 L308 99.0 L321 106.0 Z" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="1"/>
<rect x="320" y="93.0" width="3" height="12" fill="#FFFFFF"/>
<text x="334" y="75" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="12.5" fill="#444441">The cut-out is Waldo's head and hat, taken from a</text>
<text x="334" y="91" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="12.5" fill="#444441">different page. The page is the one we want to search.</text>
<text x="334" y="107" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="12.5" fill="#444441">Both are kept in color: the red and white stripes are</text>
<text x="334" y="123" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="12.5" fill="#444441">the main clue.</text>
<path d="M155.0 127 L155.0 173" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="30" y="175" width="250" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/>
<text x="155.0" y="193" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#712B13">2. Clean up the cut-out</text>
<text x="155.0" y="213" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="12" fill="#993C1D">ignore background and poles</text>
<rect x="320" y="168" width="410" height="70" rx="10" fill="#FFFFFF" stroke="#993C1D" stroke-width="1"/>
<path d="M321 196.0 L308 203.0 L321 210.0 Z" fill="#FFFFFF" stroke="#993C1D" stroke-width="1"/>
<rect x="320" y="197.0" width="3" height="12" fill="#FFFFFF"/>
<text x="334" y="187" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="12.5" fill="#444441">The cut-out has yellow background in its corners and,</text>
<text x="334" y="203" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="12.5" fill="#444441">on page 1, a spear across his face. Those pixels are</text>
<text x="334" y="219" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="12.5" fill="#444441">not Waldo. They are marked so the comparison skips them.</text>
<path d="M155.0 231 L155.0 269" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="30" y="271" width="250" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<text x="155.0" y="289" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#085041">3. Even out the page</text>
<text x="155.0" y="309" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="12" fill="#0F6E56">contrast, then a light blur</text>
<rect x="320" y="264" width="410" height="70" rx="10" fill="#FFFFFF" stroke="#0F6E56" stroke-width="1"/>
<path d="M321 292.0 L308 299.0 L321 306.0 Z" fill="#FFFFFF" stroke="#0F6E56" stroke-width="1"/>
<rect x="320" y="293.0" width="3" height="12" fill="#FFFFFF"/>
<text x="334" y="283" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="12.5" fill="#444441">Contrast is evened out in small tiles across the page so</text>
<text x="334" y="299" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="12.5" fill="#444441">a dim corner and a bright corner look alike. A light blur</text>
<text x="334" y="315" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="12.5" fill="#444441">hides tiny pen strokes. The cut-out gets the same treatment.</text>
<path d="M155.0 327 L155.0 360" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="30" y="362" width="250" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/>
<text x="155.0" y="380" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#712B13">4. Try 17 sizes</text>
<text x="155.0" y="400" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="12" fill="#993C1D">cut-out shrunk 0.6x to enlarged 1.4x</text>
<rect x="320" y="363" width="410" height="54" rx="10" fill="#FFFFFF" stroke="#993C1D" stroke-width="1"/>
<path d="M321 383.0 L308 390.0 L321 397.0 Z" fill="#FFFFFF" stroke="#993C1D" stroke-width="1"/>
<rect x="320" y="384.0" width="3" height="12" fill="#FFFFFF"/>
<text x="334" y="382" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="12.5" fill="#444441">Waldo is not the same size on every page, so the cut-out</text>
<text x="334" y="398" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="12.5" fill="#444441">is shrunk and enlarged and each size is tried in turn.</text>
<path d="M155.0 418 L155.0 459" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="30" y="461" width="250" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
<text x="155.0" y="479" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#3C3489">5. Slide and score</text>
<text x="155.0" y="499" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="12" fill="#534AB7">compare the pattern at every position</text>
<rect x="320" y="446" width="410" height="86" rx="10" fill="#FFFFFF" stroke="#534AB7" stroke-width="1"/>
<path d="M321 482.0 L308 489.0 L321 496.0 Z" fill="#FFFFFF" stroke="#534AB7" stroke-width="1"/>
<rect x="320" y="483.0" width="3" height="12" fill="#FFFFFF"/>
<text x="334" y="465" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="12.5" fill="#444441">At every position the cut-out is laid over the page and</text>
<text x="334" y="481" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="12.5" fill="#444441">the two patches are compared. Average brightness is</text>
<text x="334" y="497" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="12.5" fill="#444441">subtracted first, so only the pattern of stripes, glasses</text>
<text x="334" y="513" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="12.5" fill="#444441">and hat counts. Every position gets a score.</text>
<path d="M155.0 517 L155.0 563" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="30" y="565" width="250" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
<text x="155.0" y="583" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#3C3489">6. Keep the best spots</text>
<text x="155.0" y="603" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="12" fill="#534AB7">5 per size, no near-duplicates</text>
<rect x="320" y="558" width="410" height="70" rx="10" fill="#FFFFFF" stroke="#534AB7" stroke-width="1"/>
<path d="M321 586.0 L308 593.0 L321 600.0 Z" fill="#FFFFFF" stroke="#534AB7" stroke-width="1"/>
<rect x="320" y="587.0" width="3" height="12" fill="#FFFFFF"/>
<text x="334" y="577" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="12.5" fill="#444441">Scores from different sizes are put on one scale (how far</text>
<text x="334" y="593" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="12.5" fill="#444441">above the page's typical score). The 5 highest spots are</text>
<text x="334" y="609" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="12.5" fill="#444441">kept, and anything right next to a better spot is skipped.</text>
<path d="M155.0 621 L155.0 659" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="30" y="661" width="250" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
<text x="155.0" y="679" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#3C3489">7. Pick one</text>
<text x="155.0" y="699" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="12" fill="#534AB7">highest score wins</text>
<rect x="320" y="654" width="410" height="70" rx="10" fill="#FFFFFF" stroke="#534AB7" stroke-width="1"/>
<path d="M321 682.0 L308 689.0 L321 696.0 Z" fill="#FFFFFF" stroke="#534AB7" stroke-width="1"/>
<rect x="320" y="683.0" width="3" height="12" fill="#FFFFFF"/>
<text x="334" y="673" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="12.5" fill="#444441">All spots from all sizes and all cut-outs are sorted.</text>
<text x="334" y="689" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="12.5" fill="#444441">A spot that overlaps a better one is dropped. The top</text>
<text x="334" y="705" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="12.5" fill="#444441">spot is the answer.</text>
<path d="M155.0 717 L155.0 755" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="30" y="757" width="250" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="155.0" y="775" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#444441">8. Show it</text>
<text x="155.0" y="795" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="12" fill="#5F5E5A">red box, zoomed crop, check</text>
<rect x="320" y="750" width="410" height="70" rx="10" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="1"/>
<path d="M321 778.0 L308 785.0 L321 792.0 Z" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="1"/>
<rect x="320" y="779.0" width="3" height="12" fill="#FFFFFF"/>
<text x="334" y="769" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="12.5" fill="#444441">The page is shown with a red box on the guess and a</text>
<text x="334" y="785" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="12.5" fill="#444441">zoomed crop beside it. If we know where Waldo really is,</text>
<text x="334" y="801" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="12.5" fill="#444441">the guess counts as right when the boxes mostly overlap.</text>
</svg>